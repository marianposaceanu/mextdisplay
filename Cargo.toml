[package]
name = "mextdisplay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for managing external displays on Apple Silicon Macs"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSGraphics", "NSScreen", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSDictionary", "NSObject", "NSString", "NSValue", "std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
